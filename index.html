<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7fbff">
<title>Бюджет класса — 5 «А»</title>
<style>
:root{--ink:#0b3557;--muted:#6c8297;--green:#12aa5b;--red:#ed3047;--blue:#3976ef;--card:#fff;--shadow:0 12px 32px rgba(29,74,113,.10)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(150deg,#f7fbff 0%,#fff 48%,#fff8f5 100%);min-height:100vh}
body:before,body:after{content:"";position:fixed;border-radius:50%;z-index:-1;filter:blur(2px)}body:before{width:240px;height:240px;right:-100px;top:-80px;background:#e8faef}body:after{width:280px;height:280px;left:-130px;bottom:-100px;background:#e9f7ff}
.app{max-width:720px;margin:auto;padding:24px 16px 120px}
.hero{text-align:center;margin:2px 0 20px}.hero h1{font-size:32px;line-height:1.05;margin:0;font-weight:900;letter-spacing:-.7px}.hero .class{font-size:21px;color:#526f87;margin-top:7px}.hero-icons{display:flex;justify-content:space-between;align-items:center;margin-bottom:-25px;font-size:42px}.plane{font-size:38px;transform:rotate(-10deg)}
.card{background:rgba(255,255,255,.94);border:1px solid rgba(33,91,135,.06);border-radius:28px;box-shadow:var(--shadow)}
.summary{padding:22px;margin-bottom:28px;position:relative;overflow:hidden}.summary:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-65px;background:#edfff3;z-index:0}.summary>*{position:relative;z-index:1}.balance-head{display:flex;align-items:center;gap:14px}.wallet{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#d9f8e6;font-size:31px}.label{font-size:17px;color:#58758c}.balance{font-size:43px;font-weight:900;margin-top:2px;color:var(--ink);letter-spacing:-1px}.balance.negative{color:var(--red)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.stat{border-radius:20px;padding:14px 16px}.stat.in{background:#ecfbf2}.stat.out{background:#fff0f2}.stat .cap{font-size:14px;color:#60798e}.stat b{display:block;font-size:22px;margin-top:5px}.stat.in b{color:#078c47}.stat.out b{color:#df253d}
.section-title{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:900;margin:0 3px 14px}.section-title .ico{font-size:26px}
.collections{display:grid;grid-template-columns:1fr;gap:14px}.collection{padding:18px;position:relative;overflow:hidden}.collection:before{content:"";position:absolute;inset:0 0 auto 0;height:76px;opacity:.8}.collection:nth-child(1):before{background:linear-gradient(120deg,#fff8d8,#fff)}.collection:nth-child(2):before{background:linear-gradient(120deg,#edf3ff,#fff)}.collection:nth-child(3):before{background:linear-gradient(120deg,#fff0fb,#fff)}.collection>*{position:relative}.ctop{display:flex;align-items:center;gap:12px;margin-bottom:15px}.cicon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#fff2bd}.collection:nth-child(2) .cicon{background:#e5edff}.collection:nth-child(3) .cicon{background:#ffe2f5}.ctitle{font-size:18px;font-weight:900}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;font-size:14px}.row span{color:#5d7890}.row b{font-size:15px}.row.total{margin-top:6px;padding:11px 10px;border-radius:13px;background:#f4f8fb}.row.total b.negative{color:var(--red)}
.ops-title{margin-top:30px}.operations{padding:7px 18px}.op{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #e7edf2}.op:last-child{border-bottom:0}.opicon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900}.opicon.income{background:#e3f8eb;color:#0a9b4d}.opicon.expense{background:#ffe8ec;color:#e62943}.opname{font-weight:900;font-size:16px}.opmeta{color:#71869a;font-size:12px;margin-top:4px}.amount{font-weight:900;font-size:17px;white-space:nowrap}.amount.income{color:#079a4c}.amount.expense{color:#e52b43}
.note{text-align:center;color:#8092a2;font-size:12px;margin:18px 10px}.action-wrap{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:22px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(247,251,255,.97) 35%)}.action{max-width:688px;margin:auto;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#20bd68,#0da852);border-radius:22px;padding:17px 20px;font-size:18px;font-weight:900;box-shadow:0 10px 25px rgba(17,169,87,.25)}.plus{background:#fff;color:#16ad5a;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;font-size:24px}.error{padding:18px;color:var(--red)}
@media(min-width:650px){.collections{grid-template-columns:repeat(3,1fr)}.collection{min-height:250px}.app{padding-top:32px}}
</style>
</head>
<body>
<main class="app">
  <div class="hero-icons"><span>📚</span><span class="plane">✈️</span></div>
  <header class="hero"><h1>Бюджет класса</h1><div class="class">5 «А» класс</div></header>

  <section class="card summary">
    <div class="balance-head"><div class="wallet">👛</div><div><div class="label">Текущий остаток</div><div id="balance" class="balance">—</div></div></div>
    <div class="stats">
      <div class="stat in"><div class="cap">↑ Поступило</div><b id="income">—</b></div>
      <div class="stat out"><div class="cap">↓ Потрачено</div><b id="expense">—</b></div>
    </div>
  </section>

  <div class="section-title"><span class="ico">🪙</span>Сборы</div>
  <div id="collections" class="collections"><div class="card error">Загружаем данные…</div></div>

  <div class="section-title ops-title"><span class="ico">🕘</span>Последние операции</div>
  <section id="operations" class="card operations"><div class="error">Загружаем операции…</div></section>

  <div class="note">Данные обновляются автоматически при открытии страницы.</div>
</main>

<div class="action-wrap">
<a class="action" href="https://forms.yandex.ru/cloud/6a969cc66d2d7358b4f82434" target="_blank" rel="noopener"><span class="plus">+</span>Я перевёл деньги <span>→</span></a>
</div>

<script>
const API='https://functions.yandexcloud.net/d4e8fiumig77c93sd0au';
const icons={'Экскурсия':'🚌','Нужды класса':'🎒','Поход в театр':'🎭'};
const rub=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n||0))+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const dateRu=v=>{const p=String(v||'').slice(0,10).split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:esc(v)};
(async()=>{try{
 const r=await fetch(API,{cache:'no-store'}); if(!r.ok) throw Error('HTTP '+r.status);
 const d=await r.json(); if(!d.ok) throw Error(d.error||'API');
 const b=Number(d.total_balance||0);
 balance.textContent=rub(b); balance.classList.toggle('negative',b<0);
 income.textContent=rub(d.total_income); expense.textContent=rub(d.total_expense);
 collections.innerHTML=(d.collections||[]).map((x,i)=>{
   const bal=Number(x.balance||0);
   return `<section class="card collection"><div class="ctop"><div class="cicon">${icons[x.name]||'⭐'}</div><div class="ctitle">${esc(x.name)}</div></div>
   <div class="row"><span>Поступило</span><b style="color:#079a4c">${rub(x.income)}</b></div>
   <div class="row"><span>Потрачено</span><b style="color:#e52b43">${rub(x.expense)}</b></div>
   <div class="row total"><span>Остаток</span><b class="${bal<0?'negative':''}">${rub(bal)}</b></div></section>`}).join('')||'<div class="card error">Активных сборов пока нет.</div>';
 const ops=d.operations||[];
 operations.innerHTML=ops.length?ops.map(x=>{const inc=x.type==='income';return `<div class="op"><div class="opicon ${inc?'income':'expense'}">${inc?'↑':'↓'}</div><div><div class="opname">${esc(x.purpose)}</div><div class="opmeta">${dateRu(x.date)}${x.description?' · '+esc(x.description):''}</div></div><div class="amount ${inc?'income':'expense'}">${inc?'+':'−'}${rub(x.amount)}</div></div>`}).join(''):'<div class="error">Операций пока нет.</div>';
}catch(e){collections.innerHTML='<div class="card error">Не удалось загрузить бюджет.</div>';operations.innerHTML='<div class="error">Не удалось загрузить операции.</div>';console.error(e)}})();
</script>
</body></html>
